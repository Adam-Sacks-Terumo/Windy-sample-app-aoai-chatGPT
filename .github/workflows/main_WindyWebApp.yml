# Build and push container to Azure Container Registry
# Azure Web App Continuous Deployment handles the rest

name: Build and deploy container app to Azure Web App - WindyWebApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: gqdatabricksdevacr.azurecr.io
        username: gqdatabricksdevacr
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: |
          gqdatabricksdevacr.azurecr.io/windy/webapp:${{ github.sha }}
          gqdatabricksdevacr.azurecr.io/windy/webapp:latest
        file: ./WebApp.Dockerfile
